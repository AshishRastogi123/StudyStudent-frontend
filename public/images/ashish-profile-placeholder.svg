  <path d="M260 230v68" stroke="#C4B5FD" stroke-linecap="round" stroke-width="6"/>
  <text x="260" y="384" fill="#312E81" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="750" letter-spacing="5" text-anchor="middle">AKR</text>
  <text x="260" y="419" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2.5" text-anchor="middle">STUDYSTUDENT FOUNDER</text>
  <rect x="177" y="491" width="166" height="4" rx="2" fill="url(#mark)" fill-opacity=".38"/>
