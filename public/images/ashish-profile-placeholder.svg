<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" role="img" aria-labelledby="title description">
  <title id="title">Founder profile placeholder</title>
  <desc id="description">A branded StudyStudent placeholder with the initials AKR and an open book symbol.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset=".55" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect width="520" height="600" rx="30" fill="url(#background)"/>
  <circle cx="430" cy="96" r="118" fill="#7C3AED" fill-opacity=".055"/>
  <circle cx="64" cy="515" r="145" fill="#4F46E5" fill-opacity=".045"/>
  <rect x="95" y="126" width="330" height="330" rx="165" fill="#fff" fill-opacity=".8"/>
